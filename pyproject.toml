[project]
name = "flight-chatbot"
version = "0.2.0"
description = "A Python 3.12 flight planning chatbot prototype"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "waitress>=3.0.2,<4", "tzdata>=2025.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
