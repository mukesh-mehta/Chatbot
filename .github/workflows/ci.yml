name: Python 3.12 and frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q chatbot run.py scripts tests
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run format:check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t flight-chatbot:ci .
      - run: docker run -d --name flight-chatbot-ci --read-only --tmpfs /tmp -p 127.0.0.1:8000:8000 flight-chatbot:ci
      - run: python scripts/smoke.py
      - if: always()
        run: docker rm -f flight-chatbot-ci
